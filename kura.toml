title = "Guide"
groups = ["guide"]
[[nav.tabs]]
title = "For agents"
groups = ["agents"]
[[nav.tabs]]
title = "Internals"
groups = ["architecture", "porting"]
[[nav.tabs]]
title = "Development"
groups = ["dev", "notes"]
