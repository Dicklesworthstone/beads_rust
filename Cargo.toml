[package]
name = "beads_rust"
version = "0.5.2"
edition = "2024"
rust-version = "1.88"
autobenches = false
description = "Agent-first issue tracker (SQLite + JSONL)"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/beads_rust"
keywords = ["cli", "issue-tracker", "sqlite", "agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    "sample_beads_db_files/",
    ".beads/",
    ".agent-mail.yaml",
    ".github/",
    ".claude/",
    ".ntm/",
    "agent_baseline/",
    "docs/",
    "scripts/",
    "skills/",
    "temp_test/",
    "temp_test_2/",
    "refactor/",
    "*.webp",
    "*.png",
    "*.db",
    "*.db-wal",
    "*.db-shm",
]

[[bin]]
name = "br"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.6.6", features = ["derive", "env", "unstable-ext"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }

# Database (pure-Rust SQLite with concurrent writer support)
# NOTE: transitive fsqlite workspace deps listed explicitly so rch syncs them
# Default features minus `json`: br issues no JSON1 SQL. Note this does
# NOT fully remove fsqlite-ext-json — fsqlite-core 0.3.9 hard-depends on
# it — so serde_json's `arbitrary_precision` feature (enabled by
# ext-json 0.3.6+) is still unified into every build. That feature makes
# `serde_json::Number` serialize as a private newtype struct through
# non-serde_json serializers; `br` output bytes are unaffected (verified
# for --json and TOON), and the insta snapshot harness compensates via
# tests/snapshots `SnapshotJson`. Dropping the flag upstream in
# fsqlite-ext-json would let this trim actually remove the crate.
fsqlite = { version = "0.3.9", default-features = false, features = [
    "native",
    "linux-asupersync-uring",
    "fts5",
    "rtree",
    "icu",
    "misc",
] }
fsqlite-types = "0.3.9"
fsqlite-error = "0.3.9"
fsqlite-core = "0.3.9"
fsqlite-func = "0.3.9"
fsqlite-vdbe = "0.3.9"
fsqlite-vfs = "0.3.9"
fsqlite-pager = "0.3.9"
fsqlite-parser = "0.3.9"
fsqlite-planner = "0.3.9"
fsqlite-wal = "0.3.9"
fsqlite-btree = "0.3.9"
fsqlite-ast = "0.3.9"
fsqlite-mvcc = "0.3.9"
fsqlite-observability = "0.3.9"

# Current-thread runtime that drives fsqlite 0.3's async (!Send) futures to
# completion behind the synchronous `franken_sync::Connection` bridge.
# Pinned =0.4.9 to match both the fsqlite family's requirement
# (>=0.4.3,<0.5) and fastmcp-rust 0.7.0's exact =0.4.9 pin, so `--features
# mcp` builds carry a single asupersync version (beads_rust-fiop).
# default-features = false mirrors fsqlite's own spec.
asupersync = { version = "=0.4.9", default-features = false }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = { package = "serde_norway", version = "0.9.42" }
schemars = { version = "1.2", features = ["derive", "chrono04"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# Hashing
sha1 = "0.11.0"
sha2 = "0.11.0"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.19"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Terminal
indicatif = "0.18.6"
crossterm = "0.29"

# Rich terminal output (sibling project). Keep syntax highlighting out of the
# release build until the upstream syntect stack drops unmaintained transitive
# crates.
rich_rust = { version = "0.2.3", features = ["markdown", "json", "backtrace"] }

# TOON format support (sibling project)
toon_rust = { version = "0.2.3", package = "tru" }

# Path normalization (strips \\?\ prefix on Windows)
dunce = "1.0.5"

# Utilities
once_cell = "1.21"
regex = "1.13"
shell-words = "1.1.1"
similar = "3.1.2"
tempfile = "3.27"
unicode-width = "0.2.2"

# Versioning
semver = "1.0.28"

# MCP server (optional; gated behind the `mcp` feature)
fastmcp-rust = { version = "0.7.0", optional = true }

# Self-update (optional; gated behind the `self_update` feature)
self_update = { version = "1.0.0-rc.4", features = ["reqwest", "rustls", "github", "progress-bar", "archive-tar", "compression-tar-gz"], default-features = false, optional = true }
self-replace = { version = "1.5.0", optional = true }

# Cooperative shutdown so SIGINT/SIGTERM/SIGHUP unwind through main and let
# SqliteStorage::Drop flush the WAL instead of stranding frames on disk (#270).
[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
rustix = { version = "1.1.4", features = ["fs"] }
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
# Capability-relative Windows filesystem access. Pin exactly because the
# no-follow/open-at implementation is part of sync's hostile-path boundary.
cap-primitives = "=4.0.3"
# Direct process termination for `shutdown::exit_process` (#439): the CRT
# `exit()` path runs atexit/TLS teardown after `ExitProcess` has already
# terminated every other thread, and any destructor that joins one of those
# threads aborts with 0xC0000409, corrupting the exit code.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
mimalloc = "0.1.52"

[build-dependencies]
vergen-gix = { version = "10.0", features = ["build", "cargo", "rustc"] }

[dev-dependencies]
# Re-enables `Cx::for_testing()` / `Cx::for_request()` for this crate's own
# test builds; asupersync 0.4.8 gates those constructors behind
# `test-internals` so production consumers cannot mint ambient authority.
asupersync = { version = "=0.4.9", default-features = false, features = ["test-internals"] }
assert_cmd = "2.2.2"
flate2 = "1.1"
predicates = "3.1.4"
criterion = { version = "0.8.2", features = ["html_reports"] }
walkdir = "2.5"
insta = { version = "1.48", features = ["json", "yaml"] }
proptest = "1.11"
rand = "0.10"
toml = "=1.1.4"

[[bench]]
name = "storage_perf"
path = "benches/storage_perf.rs"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = "line-tables-only"
strip = false

[profile.dev]
opt-level = 1

# Unoptimized fsqlite schema paths can exhaust Linux's default main-thread
# stack in integration-test child binaries before the test assertions run.
[profile.test]
opt-level = 1

[features]
default = ["self_update"]
mcp = ["dep:fastmcp-rust"]
self_update = [
    "dep:self_update",
    "dep:self-replace",
    "self_update/rustls",
    "self_update/archive-tar",
    "self_update/archive-zip",
    "self_update/compression-tar-gz",
    "self_update/compression-zip-deflate",
]

# NOTE: no `[patch.crates-io]` here.
#
# All dependencies — fsqlite 0.3.9, its fsqlite-* transitive crates, and
# fastmcp-rust 0.7.0 — are published on crates.io, so this crate
# resolves everything from the registry out of the box.  That makes
# `cargo install --git https://github.com/Dicklesworthstone/beads_rust.git beads_rust --locked`
# work without requiring sibling `frankensqlite` or `fastmcp_rust`
# checkouts (issue #250 bug 1).
#
# Local co-development: contributors who want to hack on frankensqlite
# or fastmcp_rust alongside beads_rust can add a workspace-level
# `.cargo/config.toml` with their own `[patch.crates-io]` table.  See
# `scripts/dev-local-frankensqlite.toml` for a ready-to-copy template.

[lints.rust]
# Deny (not forbid): three sanctioned `#[allow(unsafe_code)]` carve-outs exist —
# `sync::db_inode_lock` for the SQLite-compatible database-inode range lock
# (no safe wrapper exists on macOS/Windows, GitHub #412) and
# `shutdown::restore_default_sigpipe_unix` for the one-line `signal(SIGPIPE,
# SIG_DFL)` that keeps `br list | head` from aborting (GitHub #434), and
# `shutdown::exit_process` for the Windows `TerminateProcess` exit path (#439).
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Allow these lints to unblock CI (need higher priority than groups)
cast_precision_loss = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
useless_let_if_seq = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
# Stylistic nursery/pedantic lints that don't reflect real defects
# assert_is_empty: new in the 2026-08 nightly clippy; rewriting thousands of
# test `assert!(x.is_empty())` calls into `assert_eq!` is churn, not safety.
assert_is_empty = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_long_first_doc_paragraph = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
redundant_clone = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
if_not_else = { level = "allow", priority = 1 }
