name: Conformance

on:
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail on any normalization differences'
        type: boolean
        default: false
      verbose:
        description: 'Enable verbose output'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  conformance:
    name: br↔bd Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-08-31

      - name: Cache cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2.9.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # bd v0.46.0 declares `go 1.24.0` in its go.mod.
          go-version: '1.24'
          cache: false

      - name: Build br
        run: cargo build --release

      # br is a port of *classic* beads: SQLite as primary storage with a JSONL
      # export. bd v0.50.0 moved to a Dolt default and made JSONL-only `no-db` the
      # default for `bd init`, so only the classic line is a valid parity
      # reference. tests/common/binary_discovery.rs enforces the same version
      # window and skips loudly when it is not met.
      #
      # This step must not be `continue-on-error`: if the reference binary is
      # unavailable the parity gate did not run, and reporting success would be
      # false assurance.
      - name: Build classic bd (Go beads) conformance reference
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BD_REF" https://github.com/steveyegge/beads.git ../beads-go
          cd ../beads-go
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$BD_COMMIT" ]; then
            echo "::error::bd $BD_REF resolved to $actual_sha, expected $BD_COMMIT"
            exit 1
          fi
          go build -o bd ./cmd/bd
          echo "BD_BINARY=$(pwd)/bd" >> "$GITHUB_ENV"
        env:
          BD_REF: v0.46.0
          # Immutable commit for the tag above; tags are mutable, this is not.
          BD_COMMIT: 812f4e529795df94b680912c996ac9a2ea8e39c6

      - name: Verify binaries
        run: |
          echo "=== br version ==="
          ./target/release/br --version
          echo ""
          echo "=== bd version ==="
          "$BD_BINARY" version

      - name: Run conformance tests
        run: |
          ARGS=()
          if [ "${{ inputs.verbose }}" = "true" ]; then
            ARGS+=(--verbose)
          fi
          scripts/conformance.sh "${ARGS[@]}"
        env:
          BD_BINARY: ${{ env.BD_BINARY }}
          CONFORMANCE_STRICT: ${{ inputs.strict_mode && '1' || '0' }}
          CONFORMANCE_TIMEOUT: 180
          NO_COLOR: 1

      - name: Upload conformance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: conformance-summary
          path: target/test-artifacts/conformance_summary.json
          if-no-files-found: ignore

      - name: Upload conformance artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: conformance-artifacts
          path: target/test-artifacts/conformance/
          if-no-files-found: ignore
