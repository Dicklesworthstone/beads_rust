name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  schedule:
    # Every six hours: catches drift that a paths-ignored push or a cancelled
    # in-progress run missed, and runs the jobs that are too slow per push.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  # Keyed by event too: a scheduled run used to land in the push run's group
  # and cancel its shards mid-flight (2026-09-04, run 33859727294), so with
  # runners scarce no push run ever finished. Pushes still supersede older
  # pushes; scheduled runs supersede only older scheduled runs.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Check (all targets)
        run: cargo check --all-targets --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf  # v2.87.2
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit --deny warnings
        continue-on-error: true  # Advisory-only for now

      - name: Check for yanked dependencies
        run: cargo audit --deny yanked

  test:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Shard membership is derived from tests/*.rs file names by
        # scripts/test-shard.sh, so every test file runs in exactly one job.
        shard: [lib, e2e-a-l, e2e-m-z, storage, misc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-31

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      - name: Run shard
        run: scripts/test-shard.sh ${{ matrix.shard }}
        env:
          NO_COLOR: 1
          RUST_LOG: error

  reliability-gates:
    name: Reliability Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    # Too slow for every push; release.yml runs the same four gates on tags.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-31

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      - name: Failure-corpus replay and doctor/recovery postconditions
        run: cargo test --test workspace_failure_replay -- --nocapture
        env:
          RUST_LOG: beads_rust=debug

      - name: Crash-injection sync matrix
        run: cargo test --test e2e_sync_failure_injection -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Long-lived single-workspace stress
        run: cargo test --test e2e_workspace_scenarios scenario_long_lived_single_workspace_stress_suite -- --nocapture
        env:
          BR_LONG_STRESS_ITERATIONS: 8
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Concurrent command-family integrity stress
        run: cargo test --test e2e_concurrency e2e_interleaved_command_families_preserve_workspace_integrity -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      # Multi-process mixed workload against a copy of this repo's own
      # .beads family (bead dk45.4); fails on any corruption post-condition.
      - name: Multi-process mixed-workload stress
        run: |
          cargo build --bin br
          scripts/br-stress.sh "$(pwd)/target/debug/br" .beads 8 60
        env:
          NO_COLOR: 1

      # Eight concurrent br process streams for 30 s; every per-issue history
      # must linearize against the sequential model and the published JSONL
      # must equal the linearized final state (bead dk45.8).
      - name: Multi-process linearizability check
        run: cargo test --test linearizability_multiprocess -- --nocapture
        env:
          NO_COLOR: 1
          BR_LINEARIZABILITY_ARTIFACT_DIR: target/test-artifacts/linearizability

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reliability-gate-artifacts
          path: target/test-artifacts/
          if-no-files-found: ignore

  audit-gates:
    name: Audit Guardrails (2026-05-09)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    # Gates added by beads_rust-6jmq for the audit-driven cleanup EPIC
    # (beads_rust-ebzi). Each step corresponds to a sibling bead's harness:
    #   - Snapshot freshness    (l6xl)
    #   - ID-pinning lint       (s5se) — runs as part of `cargo test`
    #   - Forced-cycle-close audit (30ci)
    #   - Sync-safety witness   (yyxo) — Linux only
    #   - Concurrency witness   (mjmk)
    # Documented in docs/TESTING_GUIDELINES.md and the per-bead specs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-31

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      # Prebuilt binary: compiling cargo-insta from source on the runner
      # failed when a newer nightly rejected its rustix dependency.
      - name: Install cargo-insta
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf  # v2.87.2
        with:
          tool: cargo-insta@1.46.1

      - name: Build release br binary (used by shell harnesses)
        run: cargo build --release

      # l6xl: snapshot freshness — fails CI on any *.snap.new alongside *.snap
      # Only the targets that use insta: `--workspace` compiled and ran all
      # 162 test binaries from cold and blew the job's 30-minute budget
      # (run 33867897062). The freshness contract (no *.snap.new beside a
      # *.snap) only concerns these four.
      - name: Snapshot freshness gate (beads_rust-l6xl)
        run: >-
          cargo insta test --check
          --test snapshots
          --test golden_beads_init
          --test golden_rich_panels
          --test storage_golden_snapshot
        env:
          RUST_LOG: error

      # 30ci: regression check that no closed bead has audit-suspect close_reason
      # without an audit-historical-cycle-close-* escape-hatch label
      - name: Audit suspect close_reasons gate (beads_rust-30ci)
        run: bash tests/e2e_scripts/forced_cycle_close_audit.sh

      # yyxo: filesystem-witness regression for sync allowlist (PC-1 / PC-RECOVERY)
      - name: Sync safety witness (beads_rust-yyxo)
        run: |
          export BR_BIN="$(pwd)/target/release/br"
          bash tests/e2e_scripts/sync_safety_witness.sh

      # mjmk: 50-iter concurrency no-flake harness — readers race writer.
      # Smoke-run 5 iters in CI to keep wall time bounded; full 50-iter
      # is a local pre-merge check.
      - name: Concurrency witness 5-iter smoke (beads_rust-mjmk)
        run: |
          export BR_BIN="$(pwd)/target/release/br"
          ITER_OVERRIDE=5 bash tests/e2e_scripts/concurrency_witness_logged.sh

      - name: Upload audit-gate event logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: audit-gate-event-logs
          path: |
            /tmp/sync_safety_witness_*.jsonl
            /tmp/concurrency_witness_*.jsonl
            /tmp/forced_cycle_close_audit_*.summary.txt
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: check
    # Five-platform release builds on every push burn minutes without
    # changing a decision; PRs, the schedule, and manual runs still get them.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          # Linux ARM64 (native runner - 10x faster than QEMU)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          # macOS Apple Silicon (native)
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          # macOS Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-31
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary runs (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/br --version

      - name: Verify binary runs (Windows)
        if: runner.os == 'Windows'
        run: ./target/${{ matrix.target }}/release/br.exe --version

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: br-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/br

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: br-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/br.exe

  bench-build:
    name: Build matched benchmark artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      pins: ${{ steps.benchmark_artifacts.outputs.pins }}
    env:
      BR_PERF_BASELINE_REVISION: ${{ vars.BR_PERF_BASELINE_REVISION || '081100e4e35920f08b8c6faf6daa350da2cb030a' }}
      BR_PERF_EVIDENCE: ${{ github.workspace }}/target/perf-evidence
      BR_PERF_ARTIFACT_DIR: ${{ github.workspace }}/target/perf-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate pinned benchmark source
        run: |
          set -euo pipefail
          if [[ ! "$BR_PERF_BASELINE_REVISION" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$BR_PERF_BASELINE_REVISION" == 0000000000000000000000000000000000000000 ]]; then
            echo 'benchmark_gate: inconclusive: baseline must be a full nonzero commit SHA'
            exit 2
          fi
          if ! git cat-file -e "$BR_PERF_BASELINE_REVISION^{commit}"; then
            echo 'benchmark_gate: inconclusive: pinned baseline source is unavailable'
            exit 2
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-31

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      - name: Build pinned release artifacts before measurement
        id: benchmark_build
        run: |
          set -euo pipefail
          mkdir -p "$BR_PERF_EVIDENCE"
          baseline_source="$RUNNER_TEMP/br-perf-baseline"
          baseline_target="$RUNNER_TEMP/br-perf-baseline-target"
          git worktree add --detach "$baseline_source" "$BR_PERF_BASELINE_REVISION"
          cargo build --manifest-path "$baseline_source/Cargo.toml" --target-dir "$baseline_target" --release --locked --bin br
          cargo build --release --locked --bin br
          # The debug driver times external release CLIs; building the driver in
          # debug keeps Cargo's test panic strategy from replacing release/br.
          cargo test --locked --test bench_synthetic_scale --no-run --message-format=json > "$BR_PERF_EVIDENCE/build-artifacts.jsonl"
          {
            printf 'BR_PERF_BASELINE_BINARY=%s/release/br\n' "$baseline_target"
            printf 'BR_PERF_BASELINE_SHA256=%s\n' "$(sha256sum "$baseline_target/release/br" | cut -d ' ' -f1)"
            printf 'BR_PERF_BASELINE_LOCKFILE=%s/Cargo.lock\n' "$baseline_source"
            printf 'BR_PERF_BASELINE_LOCK_SHA256=%s\n' "$(sha256sum "$baseline_source/Cargo.lock" | cut -d ' ' -f1)"
            printf 'BR_PERF_BASELINE_SOURCE=%s\n' "$BR_PERF_BASELINE_REVISION"
            printf 'BR_PERF_CANDIDATE_BINARY=%s/target/release/br\n' "$GITHUB_WORKSPACE"
            printf 'BR_PERF_CANDIDATE_SHA256=%s\n' "$(sha256sum target/release/br | cut -d ' ' -f1)"
            printf 'BR_PERF_CANDIDATE_LOCKFILE=%s/Cargo.lock\n' "$GITHUB_WORKSPACE"
            printf 'BR_PERF_CANDIDATE_LOCK_SHA256=%s\n' "$(sha256sum Cargo.lock | cut -d ' ' -f1)"
            printf 'BR_PERF_CANDIDATE_SOURCE=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, pathlib
          records = pathlib.Path(os.environ['BR_PERF_EVIDENCE'], 'build-artifacts.jsonl').read_text().splitlines()
          executables = {row['executable'] for line in records if (row := json.loads(line)).get('reason') == 'compiler-artifact'
                         and row.get('target', {}).get('name') == 'bench_synthetic_scale' and row.get('executable')}
          if len(executables) != 1:
              raise SystemExit('benchmark_gate: inconclusive: expected one compiled measurement driver')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('BR_PERF_HARNESS=' + executables.pop() + '\n')
          PY

      - name: Package benchmark artifacts
        id: benchmark_artifacts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          directory = pathlib.Path(os.environ['BR_PERF_ARTIFACT_DIR'])
          directory.mkdir(parents=True, exist_ok=False)
          pins = {f'BR_PERF_{side}_{field}': os.environ[f'BR_PERF_{side}_{field}']
                  for side in ('BASELINE', 'CANDIDATE') for field in ('SOURCE', 'SHA256', 'LOCK_SHA256')}
          files = (
              ('baseline-br', 'BR_PERF_BASELINE_BINARY', 'BR_PERF_BASELINE_SHA256'),
              ('candidate-br', 'BR_PERF_CANDIDATE_BINARY', 'BR_PERF_CANDIDATE_SHA256'),
              ('baseline-Cargo.lock', 'BR_PERF_BASELINE_LOCKFILE', 'BR_PERF_BASELINE_LOCK_SHA256'),
              ('candidate-Cargo.lock', 'BR_PERF_CANDIDATE_LOCKFILE', 'BR_PERF_CANDIDATE_LOCK_SHA256'),
              ('measurement-driver', 'BR_PERF_HARNESS', 'BR_PERF_HARNESS_SHA256'),
          )
          for name, source, digest in files:
              destination = directory / name
              shutil.copyfile(os.environ[source], destination)
              with destination.open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              if digest in pins and actual != pins[digest]:
                  raise SystemExit(f'benchmark_gate: inconclusive: {name} changed after build')
              pins[digest] = actual
          shutil.copyfile(pathlib.Path(os.environ['BR_PERF_EVIDENCE'], 'build-artifacts.jsonl'), directory / 'build-artifacts.jsonl')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('pins=' + json.dumps(pins, sort_keys=True) + '\n')
          PY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-artifacts
          path: target/perf-artifacts/
          compression-level: 1
          if-no-files-found: error

  bench:
    name: Matched benchmarks (${{ matrix.issue_count }}, ${{ matrix.flush }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: bench-build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        issue_count: [1000, 10000]
        flush: [default-auto-flush, diagnostic-no-auto-flush]
    env:
      BR_PERF_ARTIFACT_PINS: ${{ needs.bench-build.outputs.pins }}
      BR_PERF_ARTIFACT_DIR: ${{ github.workspace }}/target/perf-artifacts
      BR_PERF_SHARD_ISSUE_COUNT: ${{ matrix.issue_count }}
      BR_PERF_SHARD_FLUSH: ${{ matrix.flush }}
      # Fixed before collecting: 99 blocks permit a finite p95 upper endpoint.
      # Budgets still require prospective calibration, never a failed baseline.
      BR_PERF_ABBA_BLOCKS: '99'
      BR_PERF_BUDGETS_JSON: ${{ vars.BR_PERF_BUDGETS_JSON }}
      BR_PERF_QUIET_RUNNER: '1'
      BR_PERF_NEGATIVE_EXTRA_WORK: '1'
      BR_PERF_EVIDENCE: ${{ github.workspace }}/target/perf-evidence
    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: benchmark-artifacts
          path: target/perf-artifacts/

      - name: Verify benchmark artifact bundle
        id: benchmark_artifacts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          try:
              directory = pathlib.Path(os.environ['BR_PERF_ARTIFACT_DIR']).resolve(strict=True)
              pins = json.loads(os.environ['BR_PERF_ARTIFACT_PINS'])
              keys = {f'BR_PERF_{side}_{field}' for side in ('BASELINE', 'CANDIDATE') for field in ('SOURCE', 'SHA256', 'LOCK_SHA256')} | {'BR_PERF_HARNESS_SHA256'}
              if not isinstance(pins, dict) or set(pins) != keys:
                  raise ValueError('incomplete artifact pins')
              for key, value in pins.items():
                  size = 40 if key.endswith('_SOURCE') else 64
                  if not isinstance(value, str) or not re.fullmatch(f'[0-9a-f]{{{size}}}', value) or int(value, 16) == 0:
                      raise ValueError(f'invalid artifact pin: {key}')
              if pins['BR_PERF_CANDIDATE_SOURCE'] != os.environ['GITHUB_SHA']:
                  raise ValueError('candidate artifact source differs from this workflow revision')
              files = (
                  ('baseline-br', 'BR_PERF_BASELINE_BINARY', 'BR_PERF_BASELINE_SHA256'),
                  ('candidate-br', 'BR_PERF_CANDIDATE_BINARY', 'BR_PERF_CANDIDATE_SHA256'),
                  ('baseline-Cargo.lock', 'BR_PERF_BASELINE_LOCKFILE', 'BR_PERF_BASELINE_LOCK_SHA256'),
                  ('candidate-Cargo.lock', 'BR_PERF_CANDIDATE_LOCKFILE', 'BR_PERF_CANDIDATE_LOCK_SHA256'),
                  ('measurement-driver', 'BR_PERF_HARNESS', 'BR_PERF_HARNESS_SHA256'),
              )
              paths = {}
              for name, variable, digest in files:
                  path = directory / name
                  if path.is_symlink() or not path.is_file():
                      raise ValueError(f'missing regular artifact: {name}')
                  with path.open('rb') as stream:
                      actual = hashlib.file_digest(stream, 'sha256').hexdigest()
                  if actual != pins[digest]:
                      raise ValueError(f'artifact digest mismatch: {name}')
                  paths[variable] = str(path)
              for name in ('baseline-br', 'candidate-br', 'measurement-driver'):
                  (directory / name).chmod(0o755)
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  for key, value in (pins | paths).items():
                      env.write(f'{key}={value}\n')
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f'benchmark_gate: inconclusive: {error}')
              raise SystemExit(2)
          print('benchmark_artifacts: verified source pins and all five file digests')
          PY

      - name: Measure planted ready slowdown control
        if: matrix.issue_count == 1000 && matrix.flush == 'default-auto-flush'
        run: |
          set -euo pipefail
          directory="$BR_PERF_EVIDENCE/planted-ready"
          mkdir -p "$directory"
          # This 100% threshold tests sensitivity to 20 real ready invocations;
          # it is a diagnostic control, never an accepted workload SLO.
          set +e
          (
            set -e
            unset BR_PERF_BUDGETS_JSON
            export BR_PERF_OUTPUT="$directory"
            export BR_PERF_WORKLOAD=1000-ready-default-auto-flush
            export BR_PERF_NEGATIVE_EXTRA_WORK=20 BR_PERF_BUDGET_PCT=100
            export BR_PERF_ABBA_BLOCKS=10 BR_PERF_QUIET_RUNNER=1
            export BR_PERF_BASELINE_BINARY="$BR_PERF_CANDIDATE_BINARY"
            export BR_PERF_BASELINE_SHA256="$BR_PERF_CANDIDATE_SHA256"
            export BR_PERF_BASELINE_LOCKFILE="$BR_PERF_CANDIDATE_LOCKFILE"
            export BR_PERF_BASELINE_LOCK_SHA256="$BR_PERF_CANDIDATE_LOCK_SHA256"
            export BR_PERF_BASELINE_SOURCE="$BR_PERF_CANDIDATE_SOURCE"
            timeout --signal=TERM --kill-after=10s 1800s "$BR_PERF_HARNESS" --exact release_abba::release_cli_abba_1k_10k --ignored --nocapture
          ) 2>&1 | tee "$directory/collector.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline_status[0]}" > "$directory/collector.exit"
          printf '%s\n' "${pipeline_status[1]}" > "$directory/log-capture.exit"
          if (( pipeline_status[0] != 0 )); then exit "${pipeline_status[0]}"; fi
          if (( pipeline_status[1] != 0 )); then exit "${pipeline_status[1]}"; fi
          python3 - <<'PY'
          import json, math, os, pathlib
          directory = pathlib.Path(os.environ['BR_PERF_EVIDENCE'], 'planted-ready')
          name = '1000-ready-default-auto-flush'
          def finite(value):
              return type(value) in (int, float) and math.isfinite(value)

          def delta_matches(value, baseline, candidate):
              expected = (baseline, candidate, candidate - baseline, (candidate / baseline - 1) * 100)
              if not isinstance(value, dict) or any(not finite(value.get(key)) or not math.isclose(value[key], number, rel_tol=1e-12, abs_tol=1e-12) for key, number in zip(('baseline_ms', 'candidate_ms', 'delta_ms', 'delta_pct'), expected)):
                  raise ValueError('control quantile timing delta differs from observations or endpoints')

          def validate_regression(comparison, receipts):
              # This separate ten-block control can establish a median regression
              # while its p95 upper endpoint remains unbounded. Rust owns rank inference.
              if comparison['command'] != 'ready':
                  raise ValueError('control comparison command differs from the measured workload')
              uncertainty = comparison['uncertainty']
              expected = {
                  'method': 'binomial_order_statistics_of_block_minima_and_maxima',
                  'assumption': 'independent identically distributed whole ABBA blocks; dependence within a block allowed; runner load does not establish this assumption',
                  'coverage_scope': 'joint median and p95 for this comparison only; not simultaneous across workloads or repeated comparisons',
              }
              if not isinstance(uncertainty, dict) or any(uncertainty.get(key) != value for key, value in expected.items()) or type(uncertainty.get('block_count')) is not int or uncertainty['block_count'] != 10:
                  raise ValueError('invalid control quantile method, assumption, scope or block count')
              if any(not finite(uncertainty.get(key)) or uncertainty[key] != value for key, value in (('confidence_level', 0.95), ('one_sided_error_probability', 0.00625))):
                  raise ValueError('invalid control per-comparison confidence allocation')
              support = comparison['observed_support']
              if not isinstance(support, dict) or support.get('method') != 'observed_support_extrema_not_confidence_interval' or any(not finite(support.get(key)) for key in ('lower_ms', 'upper_ms')) or any(support[key] is not None and not finite(support[key]) for key in ('lower_pct', 'upper_pct')):
                  raise ValueError('invalid control descriptive observed support')
              samples = [receipt['samples_ms'] for receipt in receipts]
              minima = [sorted(min(side[index:index + 2]) for index in range(0, 20, 2)) for side in samples]
              maxima = [sorted(max(side[index:index + 2]) for index in range(0, 20, 2)) for side in samples]
              exceeds = []
              for quantile in ('median', 'p95'):
                  ordered = [sorted(side) for side in samples]
                  points = [side[9] + (side[10] - side[9]) / 2 if quantile == 'median' else side[18] for side in ordered]
                  delta_matches(comparison[quantile], *points)
                  interval = uncertainty[quantile]
                  lower_rank, upper_rank = interval['lower_rank'], interval['upper_rank']
                  if type(lower_rank) is not int or type(upper_rank) is not int or not 0 <= lower_rank < upper_rank <= 11 or lower_rank > 10:
                      raise ValueError('invalid control quantile order-statistic ranks')
                  if quantile == 'p95' and upper_rank != 11:
                      raise ValueError('insufficient control blocks for a finite p95 upper endpoint')
                  lower = [side[lower_rank - 1] if lower_rank else 0 for side in minima]
                  upper = [side[upper_rank - 1] if upper_rank <= 10 else None for side in maxima]
                  for side, prefix in enumerate(('baseline', 'candidate')):
                      for suffix, endpoint in (('lower', lower[side]), ('upper', upper[side])):
                          actual = interval[f'{prefix}_{suffix}_ms']
                          if (actual is not None if endpoint is None else not finite(actual) or actual != endpoint):
                              raise ValueError('control quantile endpoint differs from raw block order statistics')
                  for label, baseline, candidate in (('lower', upper[0], lower[1]), ('upper', lower[0], upper[1])):
                      if baseline is None or baseline == 0 or candidate is None:
                          if interval[label] is not None:
                              raise ValueError('unbounded control quantile delta must remain null')
                      else:
                          delta_matches(interval[label], baseline, candidate)
                          if label == 'lower':
                              exceeds.append(candidate - baseline > baseline * (comparison['budget_pct'] / 100))
              if not any(exceeds):
                  raise ValueError('control Regression is not established by a quantile lower bound')

          try:
              run = json.loads((directory / 'run.json').read_text())
              if type(run['completed_workloads']) is not int or not isinstance(run['latency_gate_exits'], list) or any(type(code) is not int for code in run['latency_gate_exits']):
                  raise ValueError('invalid integer control completion fields')
              if (run['state'], run['scope'], run['selected_workload'], run['completed_workloads'], run['latency_gate_exits']) != ('measurements_completed', 'separate_exact_workload', name, 1, [1]):
                  raise ValueError('expected one completed selected Regression control')
              summary = json.loads((directory / f'{name}-summary.json').read_text())
              budget = summary['comparison']['budget_pct']
              if type(summary['gate_exit']) is not int or type(summary['negative_control_ready_invocations']) is not int or type(budget) not in (int, float) or not math.isfinite(budget):
                  raise ValueError('invalid numeric control decision fields')
              if (summary['gate_exit'], summary['comparison']['state'], summary['comparison']['budget_pct'], summary['negative_control_ready_invocations'], summary['budget_origin']) != (1, 'regression', 100, 20, 'global diagnostic control; not an accepted SLO'):
                  raise ValueError('20x control did not establish Regression at the diagnostic 100% threshold')
              receipts = [json.loads((directory / f'{name}-{side}.json').read_text()) for side in (0, 1)]
              for receipt in receipts:
                  metadata = receipt['metadata']
                  if not isinstance(metadata, dict) or not isinstance(metadata.get('host_boot_id'), str) or metadata['host_boot_id'].strip().lower() in ('', 'unknown', 'default', 'unavailable', 'n/a', 'placeholder', 'unset'):
                      raise ValueError('missing or placeholder control host_boot_id')
                  if (metadata['command'], metadata['issue_count'], metadata['flush_mode'], metadata['build_profile']) != ('ready', '1000', 'default-auto-flush', 'release'):
                      raise ValueError('control workload identity mismatch')
                  if metadata.get('sampling_protocol') != 'abba_two_per_side_iid_blocks_assumed_v1':
                      raise ValueError('missing or invalid control block sampling protocol')
                  for key, suffix in (('binary_sha256', 'SHA256'), ('lockfile_sha256', 'LOCK_SHA256'), ('source_revision', 'SOURCE')):
                      if metadata[key] != os.environ[f'BR_PERF_CANDIDATE_{suffix}']:
                          raise ValueError(f'control {key} differs from candidate artifact pin')
                  samples, exits = receipt['samples_ms'], receipt['exit_codes']
                  if not isinstance(samples, list) or len(samples) != 20 or any(type(value) not in (int, float) or not math.isfinite(value) or value <= 0 for value in samples):
                      raise ValueError('invalid retained control samples')
                  if not isinstance(exits, list) or len(exits) != 20 or any(type(code) is not int or code != 0 for code in exits):
                      raise ValueError('expected twenty successful retained samples per side')
              if receipts[0]['metadata'] != receipts[1]['metadata']:
                  raise ValueError('same-candidate control metadata differs')
              raw = json.loads((directory / f'{name}-raw.json').read_text())
              if not isinstance(raw, list) or len(raw) != 48:
                  raise ValueError('incomplete control raw ABBA log')
              retained = [[], []]
              retained_blocks = [[], []]
              for index, sample in enumerate(raw):
                  block, position = divmod(index, 4)
                  side = (0, 1, 1, 0)[position]
                  if any(type(sample[key]) is not int or sample[key] != expected for key, expected in (('block', block), ('position', position), ('side', side), ('exit_code', 0), ('invocations', 1 if side == 0 else 20))) or sample['warmup'] is not (block < 2):
                      raise ValueError('invalid control ABBA order or invocation count')
                  elapsed = sample['elapsed_ms']
                  if type(elapsed) not in (int, float) or not math.isfinite(elapsed) or elapsed <= 0:
                      raise ValueError('invalid control elapsed time')
                  if not sample['warmup']:
                      retained[side].append(elapsed)
                      retained_blocks[side].append(block)
              if retained != [receipt['samples_ms'] for receipt in receipts]:
                  raise ValueError('control raw observations differ from retained samples')
              for side, receipt in enumerate(receipts):
                  ids = receipt['block_ids']
                  if not isinstance(ids, list) or any(type(block) is not int for block in ids) or ids != retained_blocks[side]:
                      raise ValueError('explicit control block IDs differ from raw ABBA observations')
              validate_regression(summary['comparison'], receipts)
          except (OSError, ValueError, KeyError, TypeError, OverflowError) as error:
              print(f'benchmark_sensitivity: inconclusive: {error}')
              raise SystemExit(2)
          print('benchmark_sensitivity: Regression observed for 20x ready work; diagnostic 100% threshold, not an accepted SLO')
          PY

      - name: Measure release A-A control and A-B comparison
        id: measure
        # A failed sensitivity control cannot cancel the remaining workloads
        # or become a successful shard through a later passing collector.
        if: ${{ !cancelled() && steps.benchmark_artifacts.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [[ "$BR_PERF_SHARD_ISSUE_COUNT" != 1000 && "$BR_PERF_SHARD_ISSUE_COUNT" != 10000 ]] ||
             [[ "$BR_PERF_SHARD_FLUSH" != default-auto-flush && "$BR_PERF_SHARD_FLUSH" != diagnostic-no-auto-flush ]]; then
            echo 'benchmark_gate: inconclusive: invalid workload shard'
            exit 2
          fi
          # No compilation occurs on measurement runners. Each collector owns
          # its unchanged initial/per-sample load admission and 300s settling.
          unset BR_PERF_BUDGET_PCT BR_PERF_WORKLOAD
          export BR_PERF_NEGATIVE_EXTRA_WORK=1
          if [[ -z "$BR_PERF_BUDGETS_JSON" ]]; then
            unset BR_PERF_BUDGETS_JSON
          fi
          overall=0
          for command in version ready list show create update close; do
            workload="$BR_PERF_SHARD_ISSUE_COUNT-$command-$BR_PERF_SHARD_FLUSH"
            for cohort in aa ab; do
              directory="$BR_PERF_EVIDENCE/$cohort/$workload"
              mkdir -p "$directory"
              set +e
              (
                set -e
                export BR_PERF_OUTPUT="$directory" BR_PERF_WORKLOAD="$workload"
                if [[ "$cohort" == aa ]]; then
                  export BR_PERF_BASELINE_BINARY="$BR_PERF_CANDIDATE_BINARY"
                  export BR_PERF_BASELINE_SHA256="$BR_PERF_CANDIDATE_SHA256"
                  export BR_PERF_BASELINE_LOCKFILE="$BR_PERF_CANDIDATE_LOCKFILE"
                  export BR_PERF_BASELINE_LOCK_SHA256="$BR_PERF_CANDIDATE_LOCK_SHA256"
                  export BR_PERF_BASELINE_SOURCE="$BR_PERF_CANDIDATE_SOURCE"
                fi
                timeout --signal=TERM --kill-after=10s 1800s "$BR_PERF_HARNESS" --exact release_abba::release_cli_abba_1k_10k --ignored --nocapture
              ) 2>&1 | tee "$directory/collector.log"
              pipeline_status=("${PIPESTATUS[@]}")
              set -e
              printf '%s\n' "${pipeline_status[0]}" > "$directory/collector.exit"
              printf '%s\n' "${pipeline_status[1]}" > "$directory/log-capture.exit"
              if (( pipeline_status[0] != 0 || pipeline_status[1] != 0 )); then overall=2; fi
            done
          done
          exit "$overall"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results-${{ matrix.issue_count }}-${{ matrix.flush }}
          path: target/perf-evidence/
          if-no-files-found: error

  bench-gate:
    name: Complete matched benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [bench-build, bench]
    if: ${{ always() && needs.bench-build.result == 'success' }}
    env:
      BR_PERF_EVIDENCE: ${{ github.workspace }}/target/perf-evidence
      BR_PERF_ABBA_BLOCKS: '99'
      BR_PERF_BUDGETS_JSON: ${{ vars.BR_PERF_BUDGETS_JSON }}
      BR_PERF_SHARDS_RESULT: ${{ needs.bench.result }}
      BR_PERF_BASELINE_SOURCE: ${{ fromJSON(needs.bench-build.outputs.pins).BR_PERF_BASELINE_SOURCE }}
      BR_PERF_BASELINE_SHA256: ${{ fromJSON(needs.bench-build.outputs.pins).BR_PERF_BASELINE_SHA256 }}
      BR_PERF_BASELINE_LOCK_SHA256: ${{ fromJSON(needs.bench-build.outputs.pins).BR_PERF_BASELINE_LOCK_SHA256 }}
      BR_PERF_CANDIDATE_SOURCE: ${{ fromJSON(needs.bench-build.outputs.pins).BR_PERF_CANDIDATE_SOURCE }}
      BR_PERF_CANDIDATE_SHA256: ${{ fromJSON(needs.bench-build.outputs.pins).BR_PERF_CANDIDATE_SHA256 }}
      BR_PERF_CANDIDATE_LOCK_SHA256: ${{ fromJSON(needs.bench-build.outputs.pins).BR_PERF_CANDIDATE_LOCK_SHA256 }}
    steps:
      - name: Download every benchmark shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: benchmark-results-*
          merge-multiple: true
          path: target/perf-evidence/

      - name: Enforce complete matched benchmark receipts
        if: always()
        run: |
          python3 - <<'PY'
          import json, math, os, pathlib, re
          root = pathlib.Path(os.environ['BR_PERF_EVIDENCE'])
          names = [f'{count}-{command}-{flush}' for count in (1000, 10000)
                   for flush in ('default-auto-flush', 'diagnostic-no-auto-flush')
                   for command in ('version', 'ready', 'list', 'show', 'create', 'update', 'close')]
          def finite(value):
              return type(value) in (int, float) and math.isfinite(value)

          def delta_matches(value, baseline, candidate):
              expected = (baseline, candidate, candidate - baseline, (candidate / baseline - 1) * 100)
              if not isinstance(value, dict) or any(not finite(value.get(key)) or not math.isclose(value[key], number, rel_tol=1e-12, abs_tol=1e-12) for key, number in zip(('baseline_ms', 'candidate_ms', 'delta_ms', 'delta_pct'), expected)):
                  raise ValueError('quantile timing delta differs from its observations or endpoints')

          def validate_comparison(comparison, receipts, blocks, code, budget):
              # Validate the producer's schema, selected order statistics and decision;
              # the Rust comparator owns binomial rank inference, not this consumer.
              if comparison['command'] != receipts[0]['metadata']['command']:
                  raise ValueError('comparison command differs from the measured workload')
              uncertainty = comparison['uncertainty']
              if uncertainty is None and code == 2:
                  return
              if not isinstance(uncertainty, dict):
                  raise ValueError('missing quantile uncertainty')
              expected = {
                  'method': 'binomial_order_statistics_of_block_minima_and_maxima',
                  'assumption': 'independent identically distributed whole ABBA blocks; dependence within a block allowed; runner load does not establish this assumption',
                  'coverage_scope': 'joint median and p95 for this comparison only; not simultaneous across workloads or repeated comparisons',
              }
              if any(uncertainty.get(key) != value for key, value in expected.items()) or type(uncertainty.get('block_count')) is not int or uncertainty['block_count'] != blocks:
                  raise ValueError('invalid quantile method, assumption, scope or block count')
              if any(not finite(uncertainty.get(key)) or uncertainty[key] != value for key, value in (('confidence_level', 0.95), ('one_sided_error_probability', 0.00625))):
                  raise ValueError('invalid per-comparison confidence allocation')
              support = comparison['observed_support']
              if not isinstance(support, dict) or support.get('method') != 'observed_support_extrema_not_confidence_interval' or any(not finite(support.get(key)) for key in ('lower_ms', 'upper_ms')) or any(support[key] is not None and not finite(support[key]) for key in ('lower_pct', 'upper_pct')):
                  raise ValueError('invalid descriptive observed support')
              samples = [receipt['samples_ms'] for receipt in receipts]
              minima = [sorted(min(side[index:index + 2]) for index in range(0, len(side), 2)) for side in samples]
              maxima = [sorted(max(side[index:index + 2]) for index in range(0, len(side), 2)) for side in samples]
              fits, exceeds = [], []
              for quantile in ('median', 'p95'):
                  ordered = [sorted(side) for side in samples]
                  points = [side[len(side) // 2 - 1] + (side[len(side) // 2] - side[len(side) // 2 - 1]) / 2 if quantile == 'median' else side[len(side) - len(side) // 20 - 1] for side in ordered]
                  delta_matches(comparison[quantile], *points)
                  interval = uncertainty[quantile]
                  lower_rank, upper_rank = interval['lower_rank'], interval['upper_rank']
                  if type(lower_rank) is not int or type(upper_rank) is not int or not 0 <= lower_rank < upper_rank <= blocks + 1 or upper_rank < 1 or lower_rank > blocks:
                      raise ValueError('invalid quantile order-statistic ranks')
                  if quantile == 'p95' and blocks < 99 and upper_rank != blocks + 1:
                      raise ValueError('insufficient blocks for a finite p95 upper endpoint')
                  lower = [side[lower_rank - 1] if lower_rank else 0 for side in minima]
                  upper = [side[upper_rank - 1] if upper_rank <= blocks else None for side in maxima]
                  for side, prefix in enumerate(('baseline', 'candidate')):
                      for suffix, endpoint in (('lower', lower[side]), ('upper', upper[side])):
                          actual = interval[f'{prefix}_{suffix}_ms']
                          if (actual is not None if endpoint is None else not finite(actual) or actual != endpoint):
                              raise ValueError('quantile endpoint differs from raw block order statistics')
                  for label, baseline, candidate in (('lower', upper[0], lower[1]), ('upper', lower[0], upper[1])):
                      if baseline is None or baseline == 0 or candidate is None:
                          if interval[label] is not None:
                              raise ValueError('unbounded quantile delta must remain null')
                          (fits if label == 'upper' else exceeds).append(False)
                      else:
                          delta_matches(interval[label], baseline, candidate)
                          delta, allowance = candidate - baseline, baseline * (budget / 100)
                          (fits if label == 'upper' else exceeds).append(finite(allowance) and (delta <= allowance if label == 'upper' else delta > allowance))
              expected_code = 1 if any(exceeds) else 0 if all(fits) else 2
              if code != expected_code:
                  raise ValueError('comparison decision is not established by the quantile bounds and budget')

          try:
              if os.environ.get('BR_PERF_SHARDS_RESULT') != 'success':
                  raise ValueError('one or more benchmark shards or the planted control failed')
              blocks = int(os.environ['BR_PERF_ABBA_BLOCKS'])
              if blocks < 10:
                  raise ValueError('insufficient declared ABBA blocks')
              budgets = json.loads(os.environ.get('BR_PERF_BUDGETS_JSON') or '{}')
              if not isinstance(budgets, dict) or set(budgets) != set(names) or any(type(v) not in (int, float) or not math.isfinite(v) or v < 0 for v in budgets.values()):
                  raise ValueError('missing or invalid calibrated per-workload budgets')
              decisions, paired_dimensions = {}, {}
              for cohort in ('aa', 'ab'):
                  cohort_directory = root / cohort
                  if {path.name for path in cohort_directory.iterdir()} != set(names):
                      raise ValueError(f'{cohort}: expected exactly all 28 workload directories')
                  codes = []
                  for name in names:
                      directory = cohort_directory / name
                      if directory.is_symlink() or not directory.is_dir():
                          raise ValueError(f'{cohort}/{name}: missing workload directory')
                      if (directory / 'collector.exit').read_text().strip() != '0':
                          raise ValueError(f'{cohort}/{name}: collector did not complete successfully')
                      if (directory / 'log-capture.exit').read_text().strip() != '0':
                          raise ValueError(f'{cohort}/{name}: collector log capture failed')
                      run = json.loads((directory / 'run.json').read_text())
                      if run['state'] != 'measurements_completed' or run['scope'] != 'separate_exact_workload' or run['selected_workload'] != name or type(run['completed_workloads']) is not int or run['completed_workloads'] != 1:
                          raise ValueError(f'{cohort}/{name}: incomplete or mismatched workload run')
                      count, command, flush = name.split('-', 2)
                      summary = json.loads((directory / f'{name}-summary.json').read_text())
                      comparison = summary['comparison']
                      code = summary['gate_exit']
                      if type(code) is not int or code not in (0, 1, 2) or comparison['state'] != ('pass', 'regression', 'inconclusive')[code]:
                          raise ValueError(f'{cohort}/{name}: inconsistent comparison state')
                      if not finite(comparison['budget_pct']) or comparison['budget_pct'] != budgets[name]:
                          raise ValueError(f'{cohort}/{name}: comparison used a different budget')
                      receipts = [json.loads((directory / f'{name}-{side}.json').read_text()) for side in (0, 1)]
                      for side, receipt in enumerate(receipts):
                          samples = receipt['samples_ms']
                          if not isinstance(samples, list) or len(samples) != 2 * blocks or not isinstance(receipt['exit_codes'], list) or len(samples) != len(receipt['exit_codes']) or any(not finite(x) or x <= 0 for x in samples):
                              raise ValueError(f'{cohort}/{name}: invalid raw samples')
                          if any(type(code) is not int or code != 0 for code in receipt['exit_codes']):
                              raise ValueError(f'{cohort}/{name}: failed measured process')
                          metadata = receipt['metadata']
                          required = ('command', 'issue_count', 'dataset_sha256', 'flush_mode', 'cache_protocol', 'host', 'host_boot_id', 'cpu', 'os', 'filesystem', 'target', 'features', 'engine', 'source_revision', 'lockfile_sha256', 'binary_sha256', 'build_profile')
                          if not isinstance(metadata, dict) or any(not isinstance(metadata.get(key), str) or metadata[key].strip().lower() in ('', 'unknown', 'default', 'unavailable', 'n/a', 'placeholder', 'unset') for key in required):
                              raise ValueError(f'{cohort}/{name}: missing or placeholder provenance')
                          if metadata.get('sampling_protocol') != 'abba_two_per_side_iid_blocks_assumed_v1':
                              raise ValueError(f'{cohort}/{name}: missing or invalid block sampling protocol')
                          for key in ('dataset_sha256', 'lockfile_sha256', 'binary_sha256'):
                              if not re.fullmatch('[0-9a-fA-F]{64}', metadata[key]) or int(metadata[key], 16) == 0:
                                  raise ValueError(f'{cohort}/{name}: malformed {key}')
                          if (metadata['command'], metadata['issue_count'], metadata['flush_mode'], metadata['build_profile']) != (command, count, flush, 'release'):
                              raise ValueError(f'{cohort}/{name}: workload identity mismatch')
                          artifact = 'CANDIDATE' if cohort == 'aa' or side == 1 else 'BASELINE'
                          for key, suffix in (('binary_sha256', 'SHA256'), ('lockfile_sha256', 'LOCK_SHA256'), ('source_revision', 'SOURCE')):
                              if metadata[key] != os.environ[f'BR_PERF_{artifact}_{suffix}']:
                                  raise ValueError(f'{cohort}/{name}: {key} differs from built artifact pin')
                      if len(receipts[0]['samples_ms']) != len(receipts[1]['samples_ms']):
                          raise ValueError(f'{cohort}/{name}: unequal cohort sizes')
                      provenance = ('source_revision', 'lockfile_sha256', 'binary_sha256')
                      dimensions = [{key: value for key, value in receipt['metadata'].items() if key not in provenance} for receipt in receipts]
                      if dimensions[0] != dimensions[1]:
                          raise ValueError(f'{cohort}/{name}: matched metadata differs')
                      if cohort == 'aa':
                          paired_dimensions[name] = dimensions[0]
                      elif dimensions[0] != paired_dimensions[name]:
                          raise ValueError(f'{cohort}/{name}: A/A and A/B runner or workload dimensions differ')
                      if cohort == 'aa' and receipts[0]['metadata']['binary_sha256'] != receipts[1]['metadata']['binary_sha256']:
                          raise ValueError(f'{cohort}/{name}: A/A artifact mismatch')
                      raw = json.loads((directory / f'{name}-raw.json').read_text())
                      if not isinstance(raw, list) or len(raw) != 4 * (blocks + 2):
                          raise ValueError(f'{cohort}/{name}: incomplete raw ABBA log')
                      retained = [[], []]
                      retained_blocks = [[], []]
                      for index, sample in enumerate(raw):
                          block, position = divmod(index, 4)
                          side = (0, 1, 1, 0)[position]
                          if any(type(sample[key]) is not int or sample[key] != expected for key, expected in (('block', block), ('position', position), ('side', side), ('exit_code', 0), ('invocations', 1))) or sample['warmup'] is not (block < 2):
                              raise ValueError(f'{cohort}/{name}: invalid raw ABBA order or process result')
                          elapsed = sample['elapsed_ms']
                          if type(elapsed) not in (int, float) or not math.isfinite(elapsed) or elapsed <= 0:
                              raise ValueError(f'{cohort}/{name}: invalid raw elapsed time')
                          if not isinstance(sample['stdout'], str) or not isinstance(sample['stderr'], str) or not isinstance(sample['args'], list) or not sample['args']:
                              raise ValueError(f'{cohort}/{name}: missing raw process output or arguments')
                          json.loads(sample['stdout'])
                          load = json.loads(sample['load_before'])
                          if type(load['normalized_load_one']) not in (int, float) or not 0 <= load['normalized_load_one'] <= 0.25 or type(load['logical_cpus']) is not int or load['logical_cpus'] <= 0 or not isinstance(load['compiler_processes'], list):
                              raise ValueError(f'{cohort}/{name}: invalid runner-load observation')
                          if not sample['warmup']:
                              retained[side].append(elapsed)
                              retained_blocks[side].append(block)
                      if retained != [receipt['samples_ms'] for receipt in receipts]:
                          raise ValueError(f'{cohort}/{name}: raw observations do not match comparison samples')
                      for side, receipt in enumerate(receipts):
                          ids = receipt['block_ids']
                          if not isinstance(ids, list) or any(type(block) is not int for block in ids) or ids != retained_blocks[side]:
                              raise ValueError(f'{cohort}/{name}: explicit block IDs differ from raw ABBA observations')
                      validate_comparison(comparison, receipts, blocks, code, budgets[name])
                      if not isinstance(run['latency_gate_exits'], list) or any(type(value) is not int for value in run['latency_gate_exits']) or run['latency_gate_exits'] != [code]:
                          raise ValueError(f'{cohort}/{name}: aggregate does not match workload receipt')
                      print(f'{cohort}/{name}: {comparison["diagnostic"]}')
                      codes.append(code)
                  decisions[cohort] = codes
              if any(code != 0 for code in decisions['aa']):
                  raise ValueError('A/A control did not establish stable comparisons')
              if 2 in decisions['ab']:
                  raise ValueError('one or more candidate comparisons are inconclusive')
          except (OSError, ValueError, KeyError, TypeError, OverflowError) as error:
              print(f'benchmark_gate: inconclusive: {error}')
              raise SystemExit(2)
          if 1 in decisions['ab']:
              print('benchmark_gate: regression: inspect workload diagnostics')
              raise SystemExit(1)
          print('benchmark_gate: pass: all 28 matched latency workloads and A/A controls passed; release size is gated separately')
          PY

  # Verify version auditing info is correctly embedded
  version-audit:
    name: Version Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: br-linux-x64
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/br

      - name: Verify version info
        run: |
          echo "=== Version output ==="
          ./bin/br --version
          echo ""
          echo "=== Checking for build info ==="
          VERSION_OUTPUT=$(./bin/br --version 2>&1 || true)
          if echo "$VERSION_OUTPUT" | grep -q "br\|beads"; then
            echo "Version info present"
          else
            echo "Warning: Version output may be missing expected info"
          fi

  e2e-quick:
    name: Quick E2E
    runs-on: ubuntu-latest
    # A cold runner spends ~10 min compiling before the script runs; the old
    # 10-minute limit cancelled the step at 9:57 (run 33867897062).
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-31

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1

      - name: Run quick E2E tests
        run: scripts/e2e.sh
        env:
          NO_COLOR: 1
          HARNESS_ARTIFACTS: 1
          # Dev profile: linking the six quick test binaries with the release
          # profile's fat LTO killed the hosted runner ("runner has received a
          # shutdown signal") on runs 33872723832 and 33875242391 before any
          # test ran. The release binary is exercised by the Release workflow.
          E2E_PROFILE: dev

      - name: Upload E2E summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-quick-summary
          path: target/test-artifacts/e2e_quick_summary.json
          if-no-files-found: ignore
