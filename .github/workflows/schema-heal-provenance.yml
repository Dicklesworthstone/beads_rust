name: Schema-heal provenance qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-heal-provenance.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'src/storage/**'
      - 'src/sync/**'
      - 'src/cli/commands/doctor_subsystems/schema_heal*'
      - 'src/cli/commands/doctor_subsystems/schema_heal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-heal-provenance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exactly the commit being qualified
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the repository qualification toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-08-31
      # These checks deliberately use only checked-in production code. A
      # failing replay regression must not be hidden by patching the source
      # during CI, skipping a known-failing case, or weakening the witness.
      - name: Run local restoration and rollback regressions
        run: cargo test --lib --locked storage::local_restore_tests -- --test-threads=1
      - name: Run complete schema-heal regression module
        if: ${{ !cancelled() }}
        run: cargo test --lib --locked schema_heal -- --test-threads=1
      - name: Run restoration and import regressions
        if: ${{ !cancelled() }}
        run: cargo test --lib --locked sync:: -- --test-threads=1
