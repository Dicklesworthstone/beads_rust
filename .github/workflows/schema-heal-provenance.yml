name: Schema-heal provenance qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-heal-provenance.yml'
      - 'src/storage/**'
      - 'src/sync/**'
      - 'src/cli/commands/doctor_subsystems/schema_heal*'
      - 'src/cli/commands/doctor_subsystems/schema_heal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-heal-provenance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  prepare-reviewed-restoration:
    # Temporary, exact-input source qualification. This job publishes only
    # immutable blobs for review through the GitHub integration. It never
    # creates commits, changes refs, or pushes. Remove this job once the
    # reviewed source blobs are committed; retain the read-only regressions.
    if: github.repository == 'Dicklesworthstone/beads_rust' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sqlite_sha: ${{ steps.prepare.outputs.sqlite_sha }}
      sync_sha: ${{ steps.prepare.outputs.sync_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exactly the reviewed local-restoration change
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          expected = {
              'src/storage/sqlite.rs': '4044395d098eea69c29ad8a1b7d4e05e5841dfc2',
              'src/sync/mod.rs': '10bc39155514a623aa9c968ae3497c26f6258f80',
          }
          texts = {}
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Refusing changed input: {path}: {actual} != {sha}')
              texts[path] = Path(path).read_text()
          path = 'src/storage/sqlite.rs'
          text = texts[path]
          enum = re.search(r'enum ImportSourceRepoPath\s*\{([^}]+)\}', text)
          if enum is None:
              raise SystemExit('Missing reviewed source-path policy enum')
          policies = [name for name in ('KeepLocal', 'Preserve') if re.search(r'\b' + name + r'\s*,', enum.group(1))]
          if len(policies) != 1 or not re.search(r'\bOverwrite\s*,', enum.group(1)):
              raise SystemExit('Unrecognized source-path policy; refusing to guess')
          anchor = '    fn upsert_issue_for_import_with_source_repo_path_in_tx(\n'
          if text.count(anchor) != 1 or 'fn upsert_issue_for_local_restore_in_tx(' in text:
              raise SystemExit('Restoration insertion point changed')
          method = '''    /// Replay an issue captured from this database before a rebuild.
              ///
              /// A known saved local path is authoritative, unlike a legacy path
              /// imported from another clone. An absent saved path makes no claim
              /// and must not erase the destination value. Only preserved local
              /// state may use this policy; normal JSONL imports must not.
              /// The caller owns the transaction for rows, relations and markers.
              pub(crate) fn upsert_issue_for_local_restore_in_tx(&self, issue: &Issue) -> Result<bool> {
                  let source_repo_path = if issue.source_repo_path.is_some() {
                      ImportSourceRepoPath::Overwrite
                  } else {
                      ImportSourceRepoPath::POLICY
                  };
                  self.upsert_issue_for_import_with_source_repo_path_in_tx(issue, source_repo_path)
              }

          '''
          # The literal's first line is indented four columns, subsequent
          # lines fourteen because it is embedded in Python. Normalize only
          # this newly added method; do not reformat unrelated source.
          lines = method.splitlines(keepends=True)
          method = lines[0] + ''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          method = method.replace('ImportSourceRepoPath::POLICY', 'ImportSourceRepoPath::' + policies[0])
          Path(path).write_text(text.replace(anchor, method + anchor, 1))
          path = 'src/sync/mod.rs'
          old = 'storage.upsert_issue_for_import_in_tx(&entry.issue)?;'
          new = 'storage.upsert_issue_for_local_restore_in_tx(&entry.issue)?;'
          if texts[path].count(old) != 1:
              raise SystemExit('Batch restoration call site changed')
          Path(path).write_text(texts[path].replace(old, new, 1))
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--', *expected], check=True)
          for path, key in [('src/storage/sqlite.rs', 'sqlite_sha'), ('src/sync/mod.rs', 'sync_sha')]:
              data = Path(path).read_bytes()
              local_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/beads_rust/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  remote_sha = json.load(response)['sha']
              if remote_sha != local_sha:
                  raise SystemExit('Published blob does not match reviewed bytes')
              print(json.dumps({'path': path, 'sha': remote_sha, 'tested': False}), flush=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'{key}={remote_sha}\n')
          PY
  qualify:
    needs: prepare-reviewed-restoration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the qualification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Load the exact reviewed source blobs
        env:
          GH_TOKEN: ${{ github.token }}
          SQLITE_SHA: ${{ needs.prepare-reviewed-restoration.outputs.sqlite_sha }}
          SYNC_SHA: ${{ needs.prepare-reviewed-restoration.outputs.sync_sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          from pathlib import Path
          for path, variable in [('src/storage/sqlite.rs', 'SQLITE_SHA'), ('src/sync/mod.rs', 'SYNC_SHA')]:
              sha = os.environ[variable]
              if not re.fullmatch('[0-9a-f]{40}', sha):
                  raise SystemExit('Invalid reviewed blob SHA')
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/beads_rust/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              if blob['encoding'] != 'base64':
                  raise SystemExit('Unexpected blob encoding')
              data = base64.b64decode(blob['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise SystemExit('Qualification source mismatch')
              Path(path).write_bytes(data)
          PY
      - name: Install the repository qualification toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Run local restoration and rollback regressions
        run: cargo test --lib --locked storage::local_restore_tests -- --test-threads=1
      - name: Run complete schema-heal regression module
        run: cargo test --lib --locked schema_heal -- --test-threads=1
      - name: Run restoration and import regressions
        run: cargo test --lib --locked sync:: -- --test-threads=1
