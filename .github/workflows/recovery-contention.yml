name: WAL recovery contention qualification

on:
  push:
    branches: [main]
    paths:
      - 'src/cli/commands/doctor_subsystems/schema_migration.rs'
      - 'src/franken_sync.rs'
      - 'src/franken_sync/**'
      - 'src/sync/db_inode_lock.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/repro_532_recovery_contention.rs'
      - 'tests/e2e_scripts/recovery_contention_532.py'
      - 'tests/e2e_torn_wal_startup.rs'
      - 'tests/e2e_legacy_wal_index.rs'
      - 'tests/repro_507_recovery.rs'
      - 'tests/e2e_schema_migration_upgrade.rs'
      - 'tests/workflow_action_pins.rs'
      - '.github/workflows/recovery-contention.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-contention-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify WAL recovery contention on Linux
    if: github.repository == 'Dicklesworthstone/beads_rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
      NO_COLOR: 1
    steps:
      # Native Git keeps both source checkouts independent of external Actions.
      # Qualification never changes source files or publishes a commit.
      - name: Check out the exact triggering revision
        shell: bash
        run: |
          set -euo pipefail
          git init --initial-branch=main
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install the repository's pinned Rust toolchain
        shell: bash
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy

      - name: Reproduce the original sequential Linux latch on the pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          baseline=2a3142837750901b968164d936ac40cc61f35b1a
          baseline_dir="$RUNNER_TEMP/gh532-baseline"
          baseline_target="$RUNNER_TEMP/gh532-baseline-target"
          git fetch --depth=1 origin "$baseline"
          git worktree add --detach "$baseline_dir" "$baseline"
          test "$(git -C "$baseline_dir" rev-parse HEAD)" = "$baseline"
          test "$(git -C "$baseline_dir" rev-parse HEAD:src/cli/commands/doctor_subsystems/schema_migration.rs)" = f5dd019571cd9e9146b534fa52132c46771718d1
          (
            cd "$baseline_dir"
            cargo build --locked --bin br --target-dir "$baseline_target"
          )
          git -C "$baseline_dir" diff --exit-code HEAD
          # The triggering revision's harness must still demonstrate the bug
          # on the original complete source tree, not a rewritten candidate.
          python3 tests/e2e_scripts/recovery_contention_532.py "$baseline_target/debug/br" "$RUNNER_TEMP/gh532-before" sequential explicit --expect-latch
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run recovery, namespace security, and whole-crate gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          failed=0
          gate() {
            printf '\n::group::%s\n' "$*"
            if "$@"; then
              printf 'PASS: `%s`\n\n' "$*" >> "$GITHUB_STEP_SUMMARY" || failed=1
            else
              status=$?
              printf 'FAIL (%s): `%s`\n\n' "$status" "$*" >> "$GITHUB_STEP_SUMMARY" || failed=1
              failed=1
            fi
            echo '::endgroup::'
          }
          gate cargo fmt --all -- --check
          gate cargo test --locked --lib recovery_532 -- --nocapture
          gate cargo test --locked --test repro_532_recovery_contention -- --nocapture
          gate cargo test --locked --lib franken_sync::wal_index::tests -- --nocapture
          gate cargo test --locked --lib franken_sync::tests::failed_no_checkpoint_close_keeps_its_policy_on_retry -- --nocapture
          gate cargo test --locked --lib sync::db_inode_lock::tests -- --nocapture
          gate cargo test --locked --test repro_507_recovery -- --nocapture
          gate cargo test --locked --lib cli::commands::doctor_subsystems::schema_migration::tests -- --nocapture
          gate cargo test --locked --test e2e_schema_migration_upgrade -- --nocapture
          gate cargo test --locked --test e2e_torn_wal_startup -- --nocapture
          gate cargo test --locked --test e2e_legacy_wal_index -- --nocapture
          gate cargo test --locked --test workflow_action_pins -- --nocapture
          gate cargo check --locked --all-targets --all-features
          gate cargo clippy --locked --all-targets --all-features -- -D warnings
          gate git diff --check
          gate git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$failed" -eq 0
