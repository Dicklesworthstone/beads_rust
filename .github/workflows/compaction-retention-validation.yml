name: Compaction retention validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compaction-retention-validation.yml'
      - '.github/patches/compaction-retention.patch'
      - '.github/tests/compaction-retention-imports.py'
      - 'src/config/compaction_retention.rs'
      - 'src/config/mod.rs'
      - 'src/cli/commands/sync.rs'
      - 'src/sync/mod.rs'
      - 'src/storage/sqlite.rs'
      - 'tests/e2e_sync_artifacts.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compaction-retention-validation
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: nightly-2026-08-31
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  # Bind both staged files to their reviewed input and qualified output. Only
  # the complete original pair or complete activated pair is accepted.
  REVIEWED_CONFIG_BLOB: 69850c39bdb5ee89090bca7ad4f3191eed2b5bf2
  QUALIFIED_CONFIG_BLOB: b8d61a25e4e4c6134458a9dc5f1709a6cf3e2478
  REVIEWED_E2E_BLOB: 448886e2b548c7edee462644ebf0482b97072837
  QUALIFIED_E2E_BLOB: f6291e686dfa18791064ca59e0d1a37f6160a015

jobs:
  qualify:
    name: Qualify (${{ matrix.os }}, umask ${{ matrix.umask }})
    if: github.repository == 'Dicklesworthstone/beads_rust' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        umask: ['002', '022']
    env:
      TEST_UMASK: ${{ matrix.umask }}
    steps:
      # No external Actions, persisted credentials, or write token in any
      # qualification job. Each matrix entry tests the same exact candidate.
      - name: Fetch the exact public source revision
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare the exact candidate without formatting source
        run: |
          set -euo pipefail
          config_blob=$(git hash-object src/config/mod.rs)
          e2e_blob=$(git hash-object tests/e2e_sync_artifacts.rs)
          if [ "$config_blob" = "$REVIEWED_CONFIG_BLOB" ] && [ "$e2e_blob" = "$REVIEWED_E2E_BLOB" ]; then
            git apply --check .github/patches/compaction-retention.patch
            git apply .github/patches/compaction-retention.patch
          elif [ "$config_blob" != "$QUALIFIED_CONFIG_BLOB" ] || [ "$e2e_blob" != "$QUALIFIED_E2E_BLOB" ]; then
            echo 'Refusing mixed or unreviewed compaction source and integration-test blobs' >&2
            exit 1
          fi
          test "$(git hash-object src/config/mod.rs)" = "$QUALIFIED_CONFIG_BLOB"
          test "$(git hash-object tests/e2e_sync_artifacts.rs)" = "$QUALIFIED_E2E_BLOB"
          test "$(grep -c '^mod compaction_retention;$' src/config/mod.rs)" = 1
          test "$(grep -c 'compaction_retention::complete_and_prune(' src/config/mod.rs)" = 1
          git diff --exit-code -- . ':(exclude)src/config/mod.rs' ':(exclude)tests/e2e_sync_artifacts.rs'
          printf 'RETENTION_CANDIDATE_BLOB=%s\n' "$(git hash-object src/config/mod.rs)" >> "$GITHUB_ENV"
          printf 'RETENTION_CANDIDATE_E2E_BLOB=%s\n' "$(git hash-object tests/e2e_sync_artifacts.rs)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/tests/compaction-retention-imports.py')
          compile(path.read_text(), str(path), 'exec')
          PY
      - name: Install the repository's pinned Rust toolchain
        run: |
          set -euo pipefail
          grep -Fx "channel = \"$RUSTUP_TOOLCHAIN\"" rust-toolchain.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
          command -v sqlite3
      - name: Check formatting without changing the candidate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --check
      - name: Run all retention and recovery-directory regressions
        run: |
          set -euo pipefail
          umask "$TEST_UMASK"
          cargo test --locked --lib config::compaction_retention::tests:: -- --list | tee "$RUNNER_TEMP/retention-tests.txt"
          test "$(grep -c '^config::compaction_retention::tests::.*: test$' "$RUNNER_TEMP/retention-tests.txt")" = 44
          cargo test --locked --lib config::compaction_retention::tests:: -- --test-threads=1 --nocapture | tee "$RUNNER_TEMP/retention-results.txt"
          grep -F 'test result: ok. 44 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/retention-results.txt"
          cargo test --locked --lib config::tests::recovery_directory_ -- --test-threads=1 --nocapture | tee "$RUNNER_TEMP/recovery-directory-results.txt"
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recovery-directory-results.txt"
      - name: Check and lint all targets
        run: |
          set -euo pipefail
          umask "$TEST_UMASK"
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Validate real repeated compactions and clean CLI imports
        run: |
          set -euo pipefail
          umask "$TEST_UMASK"
          cargo test --locked --test e2e_sync_artifacts e2e_sync_import_compacts_when_the_freelist_passes_the_threshold -- --exact --test-threads=1 --nocapture | tee "$RUNNER_TEMP/compaction-import-results.txt"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/compaction-import-results.txt"
          cargo build --locked --bin br
          python3 .github/tests/compaction-retention-imports.py target/debug/br
      - name: Run the complete test suite
        run: |
          set -euo pipefail
          umask "$TEST_UMASK"
          cargo test --locked --no-fail-fast
      - name: Confirm all gates exercised unchanged candidate bytes
        run: |
          set -euo pipefail
          test "$(git hash-object src/config/mod.rs)" = "$RETENTION_CANDIDATE_BLOB"
          test "$(git hash-object tests/e2e_sync_artifacts.rs)" = "$RETENTION_CANDIDATE_E2E_BLOB"
          git diff --cached --exit-code
          git diff --exit-code -- . ':(exclude)src/config/mod.rs' ':(exclude)tests/e2e_sync_artifacts.rs'
          git diff --check
          printf 'Qualified %s on %s with umask %s; config blob %s; integration-test blob %s.\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$TEST_UMASK" "$RETENTION_CANDIDATE_BLOB" "$RETENTION_CANDIDATE_E2E_BLOB" >> "$GITHUB_STEP_SUMMARY"

  activate:
    needs: qualify
    if: needs.qualify.result == 'success' && github.repository == 'Dicklesworthstone/beads_rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Reconstruct the same candidate after every matrix job passes
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          config_blob=$(git hash-object src/config/mod.rs)
          e2e_blob=$(git hash-object tests/e2e_sync_artifacts.rs)
          if [ "$config_blob" = "$REVIEWED_CONFIG_BLOB" ] && [ "$e2e_blob" = "$REVIEWED_E2E_BLOB" ]; then
            git apply --check .github/patches/compaction-retention.patch
            git apply .github/patches/compaction-retention.patch
          elif [ "$config_blob" != "$QUALIFIED_CONFIG_BLOB" ] || [ "$e2e_blob" != "$QUALIFIED_E2E_BLOB" ]; then
            echo 'Refusing mixed or unreviewed compaction source and integration-test blobs' >&2
            exit 1
          fi
          test "$(git hash-object src/config/mod.rs)" = "$QUALIFIED_CONFIG_BLOB"
          test "$(git hash-object tests/e2e_sync_artifacts.rs)" = "$QUALIFIED_E2E_BLOB"
          test "$(grep -c '^mod compaction_retention;$' src/config/mod.rs)" = 1
          test "$(grep -c 'compaction_retention::complete_and_prune(' src/config/mod.rs)" = 1
          git diff --exit-code -- . ':(exclude)src/config/mod.rs' ':(exclude)tests/e2e_sync_artifacts.rs'
          git diff --check
      - name: Publish only the exact validated implementation directly to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          def run(*args, data=None):
              return subprocess.check_output(args, input=data, text=True).strip()

          def api(path, payload=None):
              args = ['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/{path}']
              if payload is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(run(*args, data=json.dumps(payload) if payload is not None else None))

          expected = os.environ['GITHUB_SHA']
          if run('git', 'rev-parse', 'HEAD') != expected:
              raise SystemExit('Refusing a checkout different from the qualified revision')
          run('git', 'diff', '--cached', '--exit-code')
          pins = {
              'src/config/mod.rs': ('REVIEWED_CONFIG_BLOB', 'QUALIFIED_CONFIG_BLOB'),
              'tests/e2e_sync_artifacts.rs': ('REVIEWED_E2E_BLOB', 'QUALIFIED_E2E_BLOB'),
          }
          allowed = set(pins)
          changed = set(run('git', 'diff', '--name-only').splitlines())
          if changed and changed != allowed:
              raise SystemExit(f'Refusing incomplete or unexpected publication paths: {changed}')
          for path, (_, qualified_pin) in pins.items():
              if run('git', 'hash-object', path) != os.environ[qualified_pin]:
                  raise SystemExit(f'Reconstructed candidate differs from the matrix-qualified blob: {path}')
          if not changed:
              print(f'Validated source {expected} is already activated; no publication needed.')
              raise SystemExit(0)
          for path, (reviewed_pin, _) in pins.items():
              if run('git', 'rev-parse', f'HEAD:{path}') != os.environ[reviewed_pin]:
                  raise SystemExit(f'Staged activation no longer has the reviewed input blob: {path}')
          if api('git/ref/heads/main')['object']['sha'] != expected:
              raise SystemExit('main advanced; do not publish or rebase untested changes')
          base_tree = api(f'git/commits/{expected}')['tree']['sha']
          entries = []
          for path in sorted(changed):
              content = pathlib.Path(path).read_text()
              blob = api('git/blobs', {'content': content, 'encoding': 'utf-8'})['sha']
              if blob != run('git', 'hash-object', path):
                  raise SystemExit(f'Published blob differs from tested bytes: {path}')
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob})
          tree = api('git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          commit = api('git/commits', {
              'message': 'fix(config): activate validated completed-compaction retention (#554)\n\nPublish the exact candidate that passed Linux and macOS qualification under umasks 002 and 022: retention and private-directory regressions, eight real CLI compactions, clean repeated imports, formatting, all-target check/Clippy, and the complete test suite.',
              'tree': tree, 'parents': [expected],
          })['sha']
          # This non-forced update also rejects a concurrent divergent advance.
          run('gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/refs/heads/main',
              '--method', 'PATCH', '--input', '-',
              data=json.dumps({'sha': commit, 'force': False}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Validated activation commit: `{commit}`\n')
          print(f'Published validated source directly to main: {commit}')
          PY
