name: Compaction certificate validation

# A bounded #508 investigation: do not run or edit source on ordinary pushes.
# The fixture repair is published only after the differential controls and the
# complete release gate pass on exactly the tree being published.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compaction-certificate-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compaction-certificate-validation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  BR_508_CONFIG_BLOB: b51514a7b44aa7f63edd4e37425cf2f28ef60c3a
  BR_508_TEST: config::tests::vacuum_into_private_maintenance_leaves_live_family_unchanged_before_install

jobs:
  validate-and-repair:
    if: github.repository == 'Dicklesworthstone/beads_rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The token is exposed only in the final publication step. Compilation and
    # tests receive no token. No release, tag, PR, or force-update is performed.
    permissions:
      contents: write
    steps:
      - name: Check out the exact revision without persisted credentials
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:src/config/mod.rs)" = "$BR_508_CONFIG_BLOB"
          command -v rustup
          command -v gh
          command -v jq
          printf 'CARGO_TARGET_DIR=%s/br-508-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'BR_508_EVIDENCE=%s/br-508-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/br-508-evidence"
          printf 'Tested base: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum Cargo.lock src/config/mod.rs src/compaction_certificate_tests.rs src/franken_sync.rs

      - name: Install the repository-pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
          test "$(git rev-parse HEAD:rust-toolchain.toml)" = 45da545f8b47809154191d5c34e50da349c0ae9d
          rustc --version
          cargo --version

      - name: Run the differential controls before any repair
        run: |
          cargo test --locked --lib -- --list 2>&1 | tee "$BR_508_EVIDENCE/test-list.log"
          grep -Fx "$BR_508_TEST: test" "$BR_508_EVIDENCE/test-list.log"
          cat > "$BR_508_EVIDENCE/required-controls" <<'CONTROLS'
          checkpoint_rejects_malformed_live_certificate
          compaction_rejects_malformed_live_certificate_before_candidate_build
          private_main_only_copy_does_not_inherit_malformed_live_certificate
          healthy_compaction_preserves_logical_state_without_jsonl
          compaction_rejects_incomplete_checkpoint_rows_before_candidate_build
          compaction_rejects_invalid_checkpoint_values_before_candidate_build
          compaction_partial_truncate_requires_a_real_completed_passive_fallback
          CONTROLS
          while IFS= read -r name; do
            grep -Fx "compaction_certificate_tests::$name: test" "$BR_508_EVIDENCE/test-list.log"
          done < "$BR_508_EVIDENCE/required-controls"
          cargo test --locked --lib compaction_certificate_tests:: -- --nocapture --test-threads=1 2>&1 | tee "$BR_508_EVIDENCE/controls-before.log"
          while IFS= read -r name; do
            grep -F "test compaction_certificate_tests::$name ... ok" "$BR_508_EVIDENCE/controls-before.log"
          done < "$BR_508_EVIDENCE/required-controls"

      - name: Require the original named malformed-certificate failure
        run: |
          set +e
          cargo test --locked --lib -- --exact "$BR_508_TEST" --nocapture --test-threads=1 2>&1 | tee "$BR_508_EVIDENCE/original-failure.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -eq 101
          test "${statuses[1]}" -eq 0
          grep -F 'expected the injected post-maintenance hook to be the failure, got: Database error: WAL file is corrupt: parallel WAL certificate suffix does not start at a record boundary' "$BR_508_EVIDENCE/original-failure.log"
          grep -F 'test result: FAILED. 0 passed; 1 failed;' "$BR_508_EVIDENCE/original-failure.log"
          printf 'Baseline: all seven controls passed; original fixture failed with the expected record-boundary corruption.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply only the reviewed healthy-family fixture repair
        run: |
          test "$(git hash-object src/config/mod.rs)" = "$BR_508_CONFIG_BLOB"
          cat > "$BR_508_EVIDENCE/fixture-repair.patch" <<'PATCH'
          diff --git a/src/config/mod.rs b/src/config/mod.rs
          --- a/src/config/mod.rs
          +++ b/src/config/mod.rs
          @@ -9898,18 +9898,10 @@

                   let temp = TempDir::new().expect("tempdir");
                   let db_path = temp.path().join("beads.db");
          -        let sidecar_path = PathBuf::from(format!("{}-wal-cert", db_path.display()));
                   let mut storage = SqliteStorage::open(&db_path).expect("create storage");
                   storage
                       .set_config("issue_prefix", "private-source")
                       .expect("seed database");
          -        storage
          -            .checkpoint_full()
          -            .expect("establish checkpointed live baseline");
          -        fs::write(&sidecar_path, b"live-sidecar-must-not-change").unwrap();
          -
          -        let main_before = fs::read(&db_path).unwrap();
          -        let inode_before = fs::metadata(&db_path).unwrap().ino();
                   let write_authority = Arc::new(
                       crate::sync::blocking_database_family_write_lock_with_timeout(
                           temp.path(),
          @@ -9922,7 +9914,44 @@
                       .bind_database_inode_for_mutation()
                       .expect("bind compaction database inode");
                   storage.attach_write_authority(Arc::clone(&write_authority));
          +        storage
          +            .checkpoint_full()
          +            .expect("establish checkpointed live baseline");

          +        // Use the healthy engine-created family, not arbitrary -wal-cert bytes.
          +        // The malformed-certificate controls in compaction_certificate_tests
          +        // must still reject corruption before any private candidate is built.
          +        // SHM and namespace admission files are derived coordination state;
          +        // pin durable payload presence, identity and bytes, including both certs.
          +        let payload_witness = || {
          +            [
          +                "",
          +                "-wal",
          +                "-wal-cert",
          +                "-wal-cert-head",
          +                ".fsqlite-migration-state",
          +            ]
          +            .map(|suffix| {
          +                let mut member = db_path.as_os_str().to_os_string();
          +                member.push(suffix);
          +                let member = PathBuf::from(member);
          +                match fs::symlink_metadata(&member) {
          +                    Ok(metadata) => {
          +                        assert!(metadata.is_file(), "non-file payload: {}", member.display());
          +                        Some((
          +                            metadata.dev(),
          +                            metadata.ino(),
          +                            fs::read(&member).expect("read live payload"),
          +                        ))
          +                    }
          +                    Err(error) if error.kind() == std::io::ErrorKind::NotFound => None,
          +                    Err(error) => panic!("inspect live payload {}: {error}", member.display()),
          +                }
          +            })
          +        };
          +        let before = payload_witness();
          +        assert!(before[0].is_some(), "checkpointed main must exist");
          +        let hook_reached = std::cell::Cell::new(false);
                   let error = compact_database_via_vacuum_into_in_place_with_reopener(
                       storage,
                       &db_path,
          @@ -9930,12 +9959,8 @@
                       &write_authority,
                       SqliteStorage::open_with_timeout,
                       || {
          -                assert_eq!(fs::read(&db_path).unwrap(), main_before);
          -                assert_eq!(fs::metadata(&db_path).unwrap().ino(), inode_before);
          -                assert_eq!(
          -                    fs::read(&sidecar_path).unwrap(),
          -                    b"live-sidecar-must-not-change"
          -                );
          +                hook_reached.set(true);
          +                assert_eq!(payload_witness(), before);
                           Err(BeadsError::Config(
                               "stop after private maintenance, before installation".to_string(),
                           ))
          @@ -9948,15 +9973,15 @@
                   .expect_err("test hook must stop before live-family installation");

                   assert!(
          -            error.to_string().contains("stop after private maintenance"),
          +            hook_reached.get(),
          +            "private maintenance failed before the hook: {error}"
          +        );
          +        assert!(
          +            matches!(&error, BeadsError::Config(message)
          +                if message == "stop after private maintenance, before installation"),
                       "expected the injected post-maintenance hook to be the failure, got: {error}"
                   );
          -        assert_eq!(fs::read(&db_path).unwrap(), main_before);
          -        assert_eq!(fs::metadata(&db_path).unwrap().ino(), inode_before);
          -        assert_eq!(
          -            fs::read(&sidecar_path).unwrap(),
          -            b"live-sidecar-must-not-change"
          -        );
          +        assert_eq!(payload_witness(), before);
                   assert_eq!(
                       write_authority
                           .database_target_authority_state()
          PATCH
          git apply --check --recount "$BR_508_EVIDENCE/fixture-repair.patch"
          git apply --recount "$BR_508_EVIDENCE/fixture-repair.patch"
          git diff --check HEAD
          test "$(git diff --name-only HEAD)" = src/config/mod.rs
          # Pin the exact candidate before compilation. Tests must not change
          # the bytes that the final step publishes, even within this path.
          printf 'BR_508_REPAIRED_BLOB=%s\n' "$(git hash-object src/config/mod.rs)" >> "$GITHUB_ENV"
          git diff -- src/config/mod.rs

      - name: Prove the repaired hook and all refusal controls
        run: |
          test "$(git hash-object src/config/mod.rs)" = "$BR_508_REPAIRED_BLOB"
          cargo test --locked --lib -- --exact "$BR_508_TEST" --nocapture --test-threads=1 2>&1 | tee "$BR_508_EVIDENCE/repaired-hook.log"
          grep -F "test $BR_508_TEST ... ok" "$BR_508_EVIDENCE/repaired-hook.log"
          cargo test --locked --lib compaction_certificate_tests:: -- --nocapture --test-threads=1 2>&1 | tee "$BR_508_EVIDENCE/controls-after.log"
          while IFS= read -r name; do
            grep -F "test compaction_certificate_tests::$name ... ok" "$BR_508_EVIDENCE/controls-after.log"
          done < "$BR_508_EVIDENCE/required-controls"
          cargo test --locked --lib franken_sync:: -- --nocapture 2>&1 | tee "$BR_508_EVIDENCE/checkpoint-regressions.log"
          printf 'Repaired fixture reached the hook; all seven differential controls still pass.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Require the complete release gate
        run: |
          test "$(git hash-object src/config/mod.rs)" = "$BR_508_REPAIRED_BLOB"
          cargo fmt --all -- --check 2>&1 | tee "$BR_508_EVIDENCE/fmt.log"
          cargo check --locked --all-targets 2>&1 | tee "$BR_508_EVIDENCE/check.log"
          cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings 2>&1 | tee "$BR_508_EVIDENCE/clippy.log"
          cargo test --locked --no-fail-fast 2>&1 | tee "$BR_508_EVIDENCE/full-tests.log"
          git diff --check HEAD
          test "$(git diff --name-only HEAD)" = src/config/mod.rs
          test "$(git hash-object src/config/mod.rs)" = "$BR_508_REPAIRED_BLOB"
          printf 'Gate: rustfmt, all-target check, all-target Clippy (-D warnings), and full cargo test passed.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the tested repair directly to main without rebasing or force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD)" = src/config/mod.rs
          test "$(git hash-object src/config/mod.rs)" = "$BR_508_REPAIRED_BLOB"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if test "$current" != "$GITHUB_SHA"; then
            echo '::error::main advanced during validation; refusing an untested rebase or force-update.'
            exit 1
          fi
          blob=$(jq -n --rawfile content src/config/mod.rs '{content: $content, encoding: "utf-8"}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
          test "$blob" = "$BR_508_REPAIRED_BLOB"
          base_tree=$(git rev-parse 'HEAD^{tree}')
          tree=$(jq -n --arg base "$base_tree" --arg blob "$blob" \
            '{base_tree: $base, tree: [{path: "src/config/mod.rs", mode: "100644", type: "blob", sha: $blob}]}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message=$(printf 'test(config): preserve the full live family in private-compaction fixture\n\nAll seven differential controls passed before and after the repair. The\noriginal fixture reproduced the named record-boundary WalCorrupt failure;\nthe healthy fixture explicitly reached its pre-install hook and returned\nthe exact injected Config error. Main, WAL, both certificates and migration\nmarker retained their bytes, presence, device and inode at the hook and\nafter failure; original database authority remained held.\n\nNo production recovery, quarantine or checkpoint policy changed.\nValidation: rustfmt, cargo check --all-targets, all-target Clippy with\n-D warnings and full cargo test --no-fail-fast, all with the locked dependencies.\nTested base: %s\nRuntime evidence: %s\n\nRefs #508' "$GITHUB_SHA" "$run_url")
          commit=$(jq -n --arg message "$message" --arg tree "$tree" --arg parent "$GITHUB_SHA" \
            '{message: $message, tree: $tree, parents: [$parent]}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')
          # The non-forced update also rejects a race after the earlier read.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$commit" -F force=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$commit"
          printf 'Published repair: `%s`\nRuntime evidence: %s\n' "$commit" "$run_url" >> "$GITHUB_STEP_SUMMARY"
          printf 'PUBLISHED_REPAIR_COMMIT=%s\n' "$commit"

      - name: Record the exact source and log digests even on failure
        if: always()
        run: |
          if test -d "${BR_508_EVIDENCE:-}"; then
            find "$BR_508_EVIDENCE" -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum
          fi
          git status --short
          git diff --stat
